<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phaser Runtime Smoke Test</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #101827; color: white; font-family: Arial, sans-serif; }
    body { display: grid; place-items: center; }
    #status { position: fixed; top: 12px; left: 12px; z-index: 2; padding: 10px 14px; border-radius: 8px; background: #26354d; }
    #game { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="status" role="status">Loading Phaser…</div>
  <div id="game"></div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script>
    const status = document.getElementById('status');
    if (typeof Phaser === 'undefined') {
      status.textContent = 'Phaser failed to load.';
    } else {
      status.textContent = `Phaser ${Phaser.VERSION} loaded`;
      new Phaser.Game({
        type: Phaser.CANVAS,
        width: 800,
        height: 450,
        parent: 'game',
        backgroundColor: '#5267bb',
        scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
        scene: {
          create() {
            this.add.text(400, 200, 'Baby Care World is ready!', {
              fontFamily: 'Arial', fontSize: '38px', color: '#ffffff', fontStyle: 'bold'
            }).setOrigin(0.5);
            this.add.circle(400, 285, 22, 0xffd76d);
          }
        }
      });
    }
  </script>
</body>
</html>
