<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="screen-orientation" content="landscape" />
  <meta name="theme-color" content="#87CEEB" />
  <title>Baby Care World</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
      font-family: 'Arial', sans-serif;
      touch-action: none;
    }

    #game-container {
      width: 100%;
      height: 100%;
      position: fixed;
      top: 0;
      left: 0;
    }

    #game-container canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    /* Loading screen shown before Phaser loads */
    #pre-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }

    #pre-loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #pre-loader h1 {
      color: white;
      font-size: 2.5rem;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
      margin-bottom: 20px;
    }

    .loader-bar {
      width: 200px;
      height: 8px;
      background: rgba(255,255,255,0.3);
      border-radius: 4px;
      overflow: hidden;
    }

    .loader-bar-fill {
      width: 0%;
      height: 100%;
      background: white;
      border-radius: 4px;
      animation: loading 1.5s ease-in-out infinite;
    }

    @keyframes loading {
      0% { width: 0%; }
      50% { width: 100%; }
      100% { width: 0%; }
    }

    /* Safe area support for notched devices */
    @supports (padding: env(safe-area-inset-top)) {
      #game-container {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
    }
  </style>
  <script type="module" crossorigin src="./assets/index-BPPE6ufG.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/phaser-0RJB29YE.js">
</head>
<body>
  <div id="pre-loader">
    <h1>🍼 Baby Care World</h1>
    <div class="loader-bar">
      <div class="loader-bar-fill"></div>
    </div>
  </div>
  <div id="game-container"></div>
</body>
</html>
